</style><link rel="stylesheet" href="layout.css"></head><body><div id="app"></div><script>
const q=new URLSearchParams(location.search),variant=q.get('variant')||'A';
const names={A:'Ba cột cân bằng',B:'Hồ sơ mở rộng bên phải',C:'Nhân vật làm trung tâm',D:'Ưu tiên quản lý túi',E:'Gọn nhẹ · 4 trang × 25 ô'};
const shapes={sword:'M11 39 37 7l5-2-1 6-25 33M9 31l17 14M6 46l7-9',cap:'M8 34h37M13 32V19l13-9 14 9v13M22 13v19',robe:'M17 8 5 20l8 10 5-5-3 24h27l-5-24 5 5 8-10-13-12-10 7zM27 15v32',pants:'M14 8h27l-3 39H27l-1-25-3 25H12z',boots:'M9 9h13v23l8 7v8H8V31zM32 9h12v22l8 8v8H33',cape:'M20 8 11 18 5 47h43l-7-29-8-10zM20 8l6 10 7-10',bracer:'M12 9l25-2 8 37-23 5zM16 22l24-2M20 37l22-3',belt:'M5 22h44v13H5zM22 17h12v23H22z',jade:'M26 5v7M17 14h18l8 14-17 20-17-20zM22 25h9v9h-9z',orb:'M27 8a19 19 0 1 1-1 0M27 15v25M14 27h26',herb:'M25 48V20M25 30C2 29 2 7 22 20M26 38C48 31 48 10 29 23',ore:'M9 36 15 13l22-6 13 22-13 18-21-1zM15 13l13 18 9-24M9 36l19-5 9 16'};
function icon(kind){return `<svg viewBox="0 0 56 56" aria-hidden="true"><path d="${shapes[kind]||shapes.orb}" fill="${['robe','cape','jade','herb'].includes(kind)?'#82b99b55':'#dbbd7d33'}" stroke="${['jade','herb'].includes(kind)?'#9ae0b4':'#e7cf93'}" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter"/></svg>`;}
const slots=[['sword','Vũ khí'],['cap','Mũ'],['robe','Áo'],['cape','Áo choàng'],['bracer','Hộ uyển'],['belt','Đai'],['pants','Quần'],['jade','Ngọc bội'],['boots','Giày'],['orb','Pháp bảo']];
const stats=[['Sinh mệnh',120,0],['Thể lực',80,0],['Linh lực',65,0],['Công kích',18,3],['Sát phạt',12,0],['Phòng ngự',15,0],['Kháng pháp',11,0],['Ý chí',14,0],['Tốc độ',16,0],['Chính xác',17,0]];
const items=[['sword','Thanh Trúc Kiếm',3],['cape','Áo choàng Thanh Phong',2],['boots','Giày Vân Bộ',2],['robe','Pháp bào Trúc Khê',1],['pants','Quần vải Nam Lĩnh',1],['jade','Ngọc bội An Tâm',2],['cap','Khăn Thanh Trúc',1],['bracer','Hộ uyển da',1],['belt','Đai Luyện Khí',2],['orb','Hồ lô Tụ Linh',4],['sword','Huyền Thiết Kiếm',6],['robe','Cửu Vân Pháp Bào',9],['herb','Linh thảo',12],['ore','Xích thiết',8]];
let equipped=false,selected=0,pageNo=1;
function statRows(){return stats.map(([name,base,bonus])=>{const added=equipped?(name==='Công kích'?9:name==='Chính xác'?2:bonus):bonus;return `<div class="stat"><span>${name}</span><b>${base+added}${added?` <em>+${added}</em>`:''}</b></div>`;}).join('');}
function detail(){const [kind,name,level]=items[selected];return `<div class="large-icon">${icon(kind)}</div><div><h3>${name}</h3><div class="tag">${selected<12?`Cấp ${level} / 9 · ${slots.find(s=>s[0]===kind)?.[1]||'Trang bị'}`:'Nguyên liệu · Có thể xếp chồng'}</div></div><div class="bonuses"><div class="bonus"><span>${selected===0?'Công kích':'Chỉ số trang bị'}</span><b>${selected===0?'+9':'+2'}</b></div><div class="bonus"><span>${selected===0?'Chính xác':'Sinh mệnh'}</span><b>${selected===0?'+2':'+8'}</b></div></div><p>Chọn vật phẩm để xem thông tin và so với món đang đeo.</p><div class="compare"><small>Đang trang bị · Cấp 1</small><strong>Kiếm gỗ · Công kích +3</strong><em>Thay kiếm: Công kích +6</em></div><button class="primary" id="equip">${equipped&&selected===0?'Đã trang bị':'Trang bị'}</button><button class="secondary" id="remove" ${equipped?'':'disabled'}>Tháo về túi</button>`;}
function grid(){return Array.from({length:100},(_,i)=>{const item=items[i];return `<button class="cell ${item?'occupied':''} ${i===selected?'selected':''}" data-i="${i}" title="${item?item[1]:'Ô trống '+(i+1)}">${item?icon(item[0])+`<small>${i<12?'C'+item[2]:'×'+item[2]}</small>`:`<span class="number">${i+1}</span>`}</button>`;}).join('');}
function render(){document.getElementById('app').innerHTML=`<main class="stage variant-${variant.toLowerCase()}"><div class="top"><div class="stamp"><strong>${variant} / ${names[variant]}</strong><small>Bright Handheld · Hồ sơ + trang bị + túi đồ</small></div><div class="crumb">Làng Trúc Khê → Nhân vật → Trang bị & túi đồ</div></div><button class="quick" id="open">Nhân vật / Túi đồ</button><section class="shell"><header class="shell-head"><div><h1>Nhân vật & hành trang</h1><small>Vô Danh · Phàm nhân · Cấp 1</small></div><button class="close" id="close" aria-label="Đóng">×</button></header><div class="body"><section class="pane profile"><div class="eyebrow">HỒ SƠ NHÂN VẬT</div><div class="identity"><div class="avatar"></div><div><strong>Vô Danh</strong><small>Hệ tu luyện: Chưa chọn<br>Cấp tu luyện: 0 / 15</small></div></div><div class="realm">Sức mạnh <span>Cơ bản + trang bị</span></div><div class="stats">${statRows()}</div><p class="tip stat-note">Số xanh là phần cộng từ đồ đang đeo.</p><div class="foundations"><div>Ngộ tính<strong>Thượng phẩm</strong>78</div><div>Căn cốt<strong>Trung phẩm</strong>62</div><div>Tâm cảnh<strong>Thượng phẩm</strong>74</div></div></section><section class="pane outfit"><div class="eyebrow">TRANG BỊ · 10 VỊ TRÍ</div><div class="equipment"><div class="hero"></div>${slots.map(([kind,label],i)=>`<button class="equip-slot ${i===0?'selected':'empty'}" title="${label}">${icon(kind)}<small>${label}</small></button>`).join('')}<div class="halo"></div></div><div class="preview-note">Đang cầm: ${equipped?'Thanh Trúc Kiếm':'Kiếm gỗ'}<br><span class="tip">Chọn ô bên cạnh để xem / thay / tháo</span></div></section><section class="pane bag"><div class="bag-head"><h2>Túi trữ vật</h2><span class="pill">14 / 100 ô</span></div><div class="toolbar"><button class="active">Tất cả</button><button>Trang bị</button><button>Nguyên liệu</button><input placeholder="Tìm vật phẩm…" aria-label="Tìm vật phẩm"></div><div class="bag-body"><div><div class="grid">${grid()}</div><div class="pagination"><button id="prev">←</button><span>Trang ${pageNo} / 4 · ${1+(pageNo-1)*25}–${pageNo*25} / 100</span><button id="next">→</button></div><div class="grid-note"><span>Chọn món để xem chi tiết</span><span>C1–C9: cấp vật phẩm</span></div></div><aside class="detail">${detail()}</aside></div><div class="stats-mini">${statRows()}</div><p class="tip">Đồ đang đeo nằm ở ô trang bị. Túi là các món còn mang theo.</p></section></div></section><div class="mock-label">MOCKUP · chỉ số / vật phẩm minh hoạ · sprite hiện tại, chưa minh hoạ thay ngoại hình</div><footer class="footer"><div class="state"><strong>01 / VÀO & RA</strong><span>Bấm Nhân vật hoặc Túi đồ để mở cùng bảng.<br>Đóng × / Esc → tiếp tục ở đúng vị trí trên map.</span></div><div class="state"><strong>02 / THAY THÀNH CÔNG</strong><span class="good">Thanh Trúc Kiếm vào ô vũ khí; kiếm gỗ về túi.<br>Công kích 21 → 27 · chỉ số mới dùng trong combat.</span></div><div class="state"><strong>03 / TÚI ĐẦY · 100/100</strong><span class="bad">Tháo đồ: “Túi đã đầy, cần một ô trống.”</span><span>Đổi món từ túi vẫn được: đồ cũ về ô vừa lấy.</span></div></footer><div class="toast" hidden></div></main>`;
document.querySelectorAll('.cell.occupied').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.i);render();});
document.getElementById('equip').onclick=()=>{if(selected!==0){notify('Mockup thao tác: chọn Thanh Trúc Kiếm để thử thay đồ.');return;}equipped=true;render();notify('Đã trang bị Thanh Trúc Kiếm · Công kích 21 → 27');};
document.getElementById('remove').onclick=()=>{equipped=false;render();notify('Đã tháo Thanh Trúc Kiếm về túi · trạng thái minh hoạ');};
document.getElementById('close').onclick=()=>document.querySelector('.shell').classList.add('closed');document.getElementById('open').onclick=()=>document.querySelector('.shell').classList.remove('closed');
if(variant==='E'){const setPage=n=>{pageNo=Math.max(1,Math.min(4,n));render();document.querySelectorAll('.cell').forEach((b,i)=>b.style.display=i>=(pageNo-1)*25&&i<pageNo*25?'grid':'none');};document.getElementById('prev').onclick=()=>setPage(pageNo-1);document.getElementById('next').onclick=()=>setPage(pageNo+1);}
}
function notify(text){const el=document.querySelector('.toast');el.textContent=text;el.hidden=false;}
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelector('.shell').classList.add('closed');});render();
</script></body></html>
