<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mockup hồ sơ nhân vật</title>
  <style>
    :root{font-family:"Be Vietnam Pro","Arial",sans-serif;color:#fff7da;--panel:#153c32f2;--panel2:#1d4a3af0;--line:#bad18c88;--gold:#f0d694;--muted:#bed1b7;--jade:#a8dc87;--ink:#102d26;--wood:#9b603b}*{box-sizing:border-box}body{margin:0;background:#183d34;overflow:hidden}.screen{width:1920px;height:1080px;position:relative;background:url('scene-clean.png') center/cover no-repeat}.veil{position:absolute;inset:0;background:#071b1668;backdrop-filter:saturate(.82)}button{font:inherit;color:inherit}.player{position:absolute;left:24px;top:20px;width:280px;height:98px;display:flex;gap:13px;align-items:center;padding:8px 18px 8px 8px;border:1px solid var(--line);border-radius:17px;background:var(--panel);box-shadow:0 8px 30px #071d1a44}.portrait{width:68px;height:82px;flex:0 0 auto;background:url('../../../assets/production/hero-A.png') 50% 2%/300% 400% no-repeat;image-rendering:pixelated}.player strong{font-size:20px}.player small{display:block;color:var(--muted);font-size:13px;margin:8px 0}.hp{height:7px;width:160px;border-radius:5px;background:#0b2922;overflow:hidden}.hp:after{content:"";display:block;height:100%;width:100%;background:#a9dc7b}.settings{position:absolute;right:24px;top:20px;width:52px;height:52px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;font-size:25px}.map{position:absolute;left:24px;bottom:26px;width:258px;padding:11px;border:1px solid var(--line);border-radius:14px;background:var(--panel);box-shadow:0 8px 24px #071b1833}.map-head{display:flex;justify-content:space-between;font-size:12px;margin:0 3px 8px;color:var(--muted)}.mini{height:132px;border-radius:6px;background:url('scene-clean.png') 12% 77%/430% auto no-repeat;position:relative;overflow:hidden;box-shadow:inset 0 0 0 2px #d6e2ad55}.mini:after{content:"";position:absolute;left:50%;top:48%;width:8px;height:8px;transform:rotate(45deg);background:#ffe28d;border:2px solid #284432;box-shadow:0 0 0 3px #fff1a944}.place{font-size:11px;line-height:1.5;text-align:center;color:#f3e4ad;margin:9px 2px 1px}.weather{display:block;color:#a9c5aa;font-size:9px}.quickbar{position:absolute;right:24px;bottom:26px;display:flex;gap:9px}.quick{width:92px;height:78px;border:1px solid var(--line);border-radius:12px;background:var(--panel);display:grid;place-items:center;align-content:center;gap:7px;font-size:12px}.quick .ico{font-size:27px;line-height:1}.quick.active{background:#365d41;border-color:#ffe29b;box-shadow:0 0 0 2px #ffe29b33}.close{position:absolute;right:20px;top:19px;width:38px;height:38px;border:1px solid var(--line);border-radius:10px;background:#234d3d;font-size:22px}.sheet{position:absolute;background:linear-gradient(150deg,var(--panel2),#102f29f5);border:1px solid var(--line);box-shadow:0 22px 75px #061715aa,0 0 0 1px #203c2b;overflow:hidden}.sheet:before{content:"";position:absolute;inset:7px;border:1px solid #d1bd7044;border-radius:inherit;pointer-events:none}.sheet h1{font-size:26px;margin:0}.kicker{color:var(--gold);font-size:11px;letter-spacing:.16em;text-transform:uppercase}.sub{color:var(--muted);font-size:12px}.realm{display:flex;align-items:center;gap:13px;padding:13px 15px;background:#0e2b24aa;border:1px solid #abc58755;border-radius:12px}.realm b{display:block;color:var(--gold);font-size:15px}.realm span{display:block;color:var(--muted);font-size:11px;margin-top:4px}.level{margin-left:auto;text-align:right}.level strong{font-size:24px;color:#fff1bd}.progress{height:6px;border-radius:4px;background:#09221d;margin-top:8px;overflow:hidden}.progress i{display:block;width:34%;height:100%;background:linear-gradient(90deg,#91cc79,#efd17e)}.stats{display:grid;gap:8px}.stat{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:38px;padding:8px 11px;border:1px solid #bdd29529;border-radius:9px;background:#173d31aa}.stat span{font-size:11px;color:#c8d8bf}.stat b{font-size:17px;color:#fff3c6;font-variant-numeric:tabular-nums}.traits{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.trait{padding:12px;border:1px solid #d6c78955;border-radius:11px;background:linear-gradient(180deg,#45624388,#193a30aa);text-align:center}.trait small{display:block;font-size:10px;color:#c5d6bd}.trait b{display:block;font-size:15px;margin:6px 0;color:var(--gold)}.trait em{font-style:normal;font-size:19px}.section-title{font-size:11px;color:var(--gold);letter-spacing:.1em;margin:0 0 9px;text-transform:uppercase}.hint{font-size:10px;color:#a9c5ad}.route{position:absolute;z-index:2;font-weight:700;white-space:nowrap}.badge{position:absolute;left:325px;top:24px;padding:8px 12px;border-radius:8px;background:#112e27dd;border:1px solid #bdd29377;font-size:11px;color:#efd99a;letter-spacing:.08em}.mock-note{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);padding:7px 15px;border-radius:18px;background:#112f288a;color:#e5e8cd;font-size:11px}.a .sheet{left:50%;top:50%;width:820px;height:820px;transform:translate(-50%,-50%);border-radius:22px;padding:34px 38px}.a .head{display:grid;grid-template-columns:90px 1fr;gap:18px;align-items:center}.a .hero-big{width:88px;height:116px;background:url('../../../assets/production/hero-A.png') 50% 2%/300% 400% no-repeat;image-rendering:pixelated}.a .realm{margin:20px 0}.a .stats{grid-template-columns:repeat(2,1fr)}.a .traits{margin-top:18px}.a .route{padding:7px 12px;border-radius:7px;background:#183a30dc;border:1px solid #c6d49b88;font-size:11px}.a .r1{left:50%;top:72px;transform:translateX(-50%)}.a .r2{left:12px;top:48%}.a .r3{right:12px;bottom:170px}.b .sheet{right:0;top:0;width:570px;height:100%;padding:34px 36px;border-radius:22px 0 0 22px}.b .head{padding-right:55px}.b .realm{margin:22px 0 18px}.b .stats{grid-template-columns:repeat(2,1fr)}.b .traits{margin-top:18px}.b .quickbar{right:592px}.b .settings{right:592px}.b .route{padding:10px 14px;background:#17392ff0;border:1px solid #cfdaa3;border-radius:20px;font-size:11px}.b .r1{left:50%;top:18px;transform:translateX(-50%)}.b .r2{left:0;top:49%;border-radius:0 18px 18px 0}.b .r3{right:570px;top:53%;border-radius:18px 0 0 18px}.c .sheet{left:50%;top:50%;width:1040px;height:760px;transform:translate(-50%,-50%);border-radius:28px;padding:32px 40px}.c .head{text-align:center}.c .realm{width:520px;margin:18px auto}.c .content{display:grid;grid-template-columns:1fr 300px 1fr;gap:20px;align-items:center}.c .stats.left,.c .stats.right{grid-template-columns:1fr}.c .core{height:310px;display:grid;place-items:center;position:relative}.c .core:before{content:"";width:220px;height:220px;border:1px solid #d9d08a77;border-radius:50%;box-shadow:0 0 0 25px #75935c12,0 0 45px #b6d27e22}.c .core-title{position:absolute;text-align:center}.c .core-title b{font-size:22px;color:var(--gold)}.c .core-title span{display:block;font-size:10px;color:var(--muted);margin-top:6px}.c .traits{margin-top:10px}.c .route{width:34px;height:34px;border-radius:50%;border:2px solid #ffe296;background:#174737aa;box-shadow:0 0 0 8px #bfe88b33,0 0 22px #e3ef8a;color:transparent}.c .route:after{content:"";position:absolute;inset:8px;border:2px solid #fff1ad;border-radius:50%}.c .r1{left:50%;top:76px}.c .r2{left:25px;top:49%}.c .r3{right:25px;bottom:145px}.c .near-label{position:absolute;left:55px;top:51%;padding:6px 10px;border-radius:8px;background:#122d27dd;font-size:10px}.d .sheet{left:50%;bottom:122px;width:1290px;height:430px;transform:translateX(-50%);border-radius:22px;padding:25px 33px}.d .head{display:flex;align-items:center;gap:20px;padding-right:55px}.d .head .sub{margin-left:auto}.d .realm{margin:16px 0}.d .stats{grid-template-columns:repeat(5,1fr)}.d .traits{position:absolute;right:34px;bottom:28px;width:460px}.d .hint{position:absolute;left:34px;bottom:36px;width:500px}.d .map{bottom:584px}.d .quickbar{bottom:26px}.d .route{padding:7px 12px;background:#855733;border:2px solid #5d3826;border-radius:3px;box-shadow:0 5px 0 #41281d;font-size:11px;color:#fff2c6;transform:rotate(-1deg)}.d .route:before{content:"";position:absolute;left:50%;top:100%;width:7px;height:28px;background:#5e3c29}.d .r1{left:50%;top:74px}.d .r2{left:18px;top:49%}.d .r3{right:18px;bottom:155px}.e .sheet{right:126px;top:78px;width:660px;height:790px;border-radius:24px;padding:32px 35px}.e .head{display:grid;grid-template-columns:100px 1fr;gap:16px;align-items:center}.e .hero-big{width:95px;height:126px;background:url('../../../assets/production/hero-A.png') 50% 2%/300% 400% no-repeat;image-rendering:pixelated}.e .realm{margin:18px 0}.e .stats{grid-template-columns:repeat(2,1fr)}.e .traits{margin-top:18px}.e .quickbar{right:24px}.e .settings{right:24px}.e .map{width:300px}.e .mini{height:156px}.e .pin{position:absolute;width:20px;height:20px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#f0d37f;border:2px solid #294733}.e .pin:after{content:"";position:absolute;width:5px;height:5px;left:5px;top:5px;background:#315542;border-radius:50%}.e .p1{left:48%;top:5%}.e .p2{left:4%;top:54%}.e .p3{right:4%;top:58%}.e .map-legend{display:flex;justify-content:space-between;font-size:9px;color:#dbc985;margin-top:7px}.e .route{display:none}
  </style>
</head>
<body><div id="app"></div><script>
const stats=[['Sinh mệnh','120'],['Thể lực','80'],['Linh lực','65'],['Công kích','18'],['Sát phạt','12'],['Phòng ngự','15'],['Kháng pháp','11'],['Ý chí','14'],['Tốc độ','16'],['Chính xác','17']];
const variant=new URLSearchParams(location.search).get('variant')||'A';
const names={A:'Ngọc giản cân bằng',B:'Hồ sơ cạnh phải',C:'Kinh mạch trung tâm',D:'Sổ tre gọn',E:'Bản đồ dẫn đường'};
const statHtml=(side='')=>`<div class="stats ${side}">${stats.map(([n,v])=>`<div class="stat"><span>${n}</span><b>${v}</b></div>`).join('')}</div>`;
const traits=`<div class="traits"><div class="trait"><small>Ngộ tính</small><b>Thượng phẩm</b><em>78</em></div><div class="trait"><small>Căn cốt</small><b>Trung phẩm</b><em>62</em></div><div class="trait"><small>Tâm cảnh</small><b>Thượng phẩm</b><em>74</em></div></div>`;
const realm=`<div class="realm"><div><b>Chưa nhập đạo</b><span>Hệ tu luyện: Chưa chọn</span><div class="progress"><i></i></div></div><div class="level"><span>Cấp nhân vật</span><strong>1</strong></div></div>`;
const base=`<div class="player"><div class="portrait"></div><div><strong>Vô Danh</strong><small>Phàm nhân · Cấp 1</small><div class="hp"></div></div></div><div class="badge">${variant} · ${names[variant]}</div><button class="settings">☷</button><div class="map"><div class="map-head"><b>Bản đồ</b><span>Trúc Khê</span></div><div class="mini">${variant==='E'?'<i class="pin p1"></i><i class="pin p2"></i><i class="pin p3"></i>':''}</div>${variant==='E'?'<div class="map-legend"><span>← Rừng</span><span>↑ Thiên Lộ</span><span>Núi →</span></div>':''}<div class="place">Làng Trúc Khê<span class="weather">Nam Lĩnh · Nắng sớm</span></div></div><nav class="quickbar"><button class="quick"><span class="ico">♧</span>Túi đồ</button><button class="quick"><span class="ico">▤</span>Nhiệm vụ</button><button class="quick active"><span class="ico">♙</span>Nhân vật</button></nav>`;
let panel='';
if(variant==='A')panel=`<section class="sheet"><button class="close">×</button><div class="head"><div class="hero-big"></div><div><div class="kicker">Hồ sơ nhân vật</div><h1>Vô Danh</h1><div class="sub">Phàm nhân đang tìm con đường tu luyện</div></div></div>${realm}<div class="section-title">Thuộc tính sức mạnh</div>${statHtml()}<div class="section-title" style="margin-top:18px">Nền tảng tu luyện</div>${traits}<p class="hint">Tất cả chỉ số hiển thị dạng số nguyên. Phẩm chất đi kèm điểm hiện tại để dễ so sánh.</p></section>`;
if(variant==='B')panel=`<section class="sheet"><button class="close">×</button><div class="head"><div class="kicker">Nhân vật</div><h1>Vô Danh</h1><div class="sub">Phàm nhân · Cấp 1</div></div>${realm}<div class="section-title">Sức mạnh</div>${statHtml()}<div class="section-title" style="margin-top:18px">Căn cơ</div>${traits}<p class="hint">Bảng trượt từ nút Nhân vật, đóng lại vẫn giữ nguyên vị trí trên bản đồ.</p></section>`;
if(variant==='C'){const left=stats.slice(0,5),right=stats.slice(5);panel=`<section class="sheet"><button class="close">×</button><div class="head"><div class="kicker">Nội quan</div><h1>Vô Danh · Phàm nhân</h1></div>${realm}<div class="content"><div class="stats left">${left.map(([n,v])=>`<div class="stat"><span>${n}</span><b>${v}</b></div>`).join('')}</div><div class="core"><div class="core-title"><b>Cấp 1</b><span>Chưa nhập đạo</span></div></div><div class="stats right">${right.map(([n,v])=>`<div class="stat"><span>${n}</span><b>${v}</b></div>`).join('')}</div></div>${traits}</section><span class="near-label">Rừng Thanh Trúc · tới gần để xem</span>`}
if(variant==='D')panel=`<section class="sheet"><button class="close">×</button><div class="head"><div><div class="kicker">Sổ tu hành</div><h1>Vô Danh</h1></div><div class="sub">Xem nhanh mọi chỉ số trong một lượt</div></div>${realm}<div class="section-title">Thuộc tính sức mạnh</div>${statHtml()}${traits}<p class="hint">Bảng thấp giữ phần lớn khung cảnh và các lối đi trong tầm mắt.</p></section>`;
if(variant==='E')panel=`<section class="sheet"><button class="close">×</button><div class="head"><div class="hero-big"></div><div><div class="kicker">Hồ sơ tu hành</div><h1>Vô Danh</h1><div class="sub">Phàm nhân · Cấp 1</div></div></div>${realm}<div class="section-title">Thuộc tính</div>${statHtml()}<div class="section-title" style="margin-top:18px">Căn cơ</div>${traits}<p class="hint">Lối ra chỉ nằm trên bản đồ nhỏ; tên đầy đủ hiện khi rê chuột hoặc tới gần.</p></section>`;
const routes=`<span class="route r1">${variant==='C'?'':'↑ Đường Thiên Lộ'}</span><span class="route r2">${variant==='C'?'':'← Rừng Thanh Trúc'}</span><span class="route r3">${variant==='C'?'':'Núi Xích Nham →'}</span>`;
document.getElementById('app').innerHTML=`<main class="screen ${variant.toLowerCase()}"><div class="veil"></div>${base}${routes}${panel}</main>`;
  </script></body>
</html>
